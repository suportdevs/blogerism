services:
  db:
    image: postgres:16-alpine
    container_name: nova_cms_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: cms
      POSTGRES_PASSWORD: cms_secret
      POSTGRES_DB: nova_cms
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
